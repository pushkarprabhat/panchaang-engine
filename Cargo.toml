[package]
name = "panchaang-engine"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Owned bi-directional Panchang engine (Gregorian ↔ Hindu calendar)"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.serde-wasm-bindgen]
version = "0.6"
optional = true

[features]
default = []
ephem = []
server = ["axum", "tokio"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]

[[bin]]
name = "panchaang"
path = "src/bin/panchaang.rs"

[[bin]]
name = "panchaang-api"
path = "src/bin/panchaang-api.rs"
required-features = ["server"]
